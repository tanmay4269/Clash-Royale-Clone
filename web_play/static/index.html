<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clash Royale Web Play</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="setup" id="setup">
        <div class="setup-header">
          <div>
            <h1>Clash Royale Web Play</h1>
            <p id="dependencyStatus"></p>
          </div>
          <button id="startButton" class="primary">Enter to Play</button>
        </div>
        <div class="chooser">
          <label for="opponentSelect">Opponent</label>
          <select id="opponentSelect"></select>
          <div class="meta" id="opponentMeta"></div>
        </div>
      </section>

      <section class="game" id="game" hidden>
        <div class="topbar">
          <div>
            <strong id="matchTitle">Match</strong>
            <span id="matchMeta"></span>
          </div>
          <button id="newMatchButton">New Match</button>
        </div>
        <div class="play-area">
          <canvas id="gameCanvas"></canvas>
        </div>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
