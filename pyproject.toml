[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clash-royale-rl"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []   # existing deps managed separately (conda / pip -r requirements.txt)

[tool.setuptools.packages.find]
where = ["."]
include = ["game*", "rl*"]
